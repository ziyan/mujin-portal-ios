# The Xcode project, described as text. XcodeGen turns this into
# MujinPortal.xcodeproj, which is not committed: run `xcodegen generate` in
# this directory after changing it. See README.md.

name: MujinPortal

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig

packages:
  PortalKit:
    path: PortalKit

targets:
  MujinPortal:
    type: application
    platform: iOS
    sources:
      - PortalApp/Sources
      - PortalApp/Resources
      - Shared
    dependencies:
      - package: PortalKit
      - target: MujinPortalNotification
      - target: PortalShare
    info:
      path: PortalApp/Info.plist
      properties:
        PortalAppGroup: $(MUJINPORTAL_APP_GROUP)
        PortalKeychainGroup: $(AppIdentifierPrefix)$(MUJINPORTAL_KEYCHAIN_GROUP)
        # Which of Apple's push services issues this build's token: sandbox for
        # a build run from Xcode, production for TestFlight and the App Store.
        PortalPushEnvironment: $(MUJINPORTAL_PUSH_ENVIRONMENT)
        UIBackgroundModes: [remote-notification]
        # Apple requires one of these for the communication notifications entitlement.
        NSUserActivityTypes: [INSendMessageIntent]
        CFBundleURLTypes:
          - CFBundleURLName: $(MUJINPORTAL_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - com.ziyan.mujinportal
    entitlements:
      path: PortalApp/MujinPortal.entitlements
      properties:
        # Development here; the App Store export re-signs for production.
        aps-environment: development
        com.apple.security.application-groups:
          - $(MUJINPORTAL_APP_GROUP)
        com.apple.developer.usernotifications.communication: true
        com.apple.developer.usernotifications.time-sensitive: true
        # The shared group comes first, which is where an item goes when no
        # group is named.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(MUJINPORTAL_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUJINPORTAL_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: MujinPortal
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Portal
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait unless a controller screen is open: AppDelegate narrows the list to portrait elsewhere.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # The iPad turns every way: iPadOS offers Split View and Slide Over
        # only to an app that supports all four orientations.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to attach to a ticket.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk to the assistant by voice.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # The app only uses the HTTPS the system provides, which export rules
        # exempt; saying so here spares every upload the question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"

  # Shapes each push before it shows: a question's choices become buttons,
  # an approval gets Approve and Deny, and an answered card is cleared.
  MujinPortalNotification:
    type: app-extension
    platform: iOS
    sources:
      - PortalNotification
      - path: PortalApp/Resources/Localizable.xcstrings
    dependencies:
      - package: PortalKit
    entitlements:
      path: PortalNotification/MujinPortalNotification.entitlements
      properties:
        com.apple.security.application-groups:
          - $(MUJINPORTAL_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(MUJINPORTAL_KEYCHAIN_GROUP)
    info:
      path: PortalNotification/Info.plist
      properties:
        CFBundleDisplayName: Portal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PortalAppGroup: $(MUJINPORTAL_APP_GROUP)
        PortalKeychainGroup: $(AppIdentifierPrefix)$(MUJINPORTAL_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUJINPORTAL_BUNDLE_IDENTIFIER).notification
        # The Swift 5 language mode: the extension API hands over a
        # completion handler that is not marked as safe to send between threads.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

  # The share sheet: text, addresses, images, PDFs and other files go to the
  # assistant or become a ticket.
  PortalShare:
    type: app-extension
    platform: iOS
    sources:
      - PortalShare
      - Shared
      - path: PortalApp/Resources/Localizable.xcstrings
    dependencies:
      - package: PortalKit
    entitlements:
      path: PortalShare/PortalShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(MUJINPORTAL_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(MUJINPORTAL_KEYCHAIN_GROUP)
    info:
      path: PortalShare/Info.plist
      properties:
        CFBundleDisplayName: Portal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PortalAppGroup: $(MUJINPORTAL_APP_GROUP)
        PortalKeychainGroup: $(AppIdentifierPrefix)$(MUJINPORTAL_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 3
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUJINPORTAL_BUNDLE_IDENTIFIER).share
        # The Swift 5 language mode, as for the notification extension.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  MujinPortal:
    build:
      targets:
        MujinPortal: all
    run:
      config: Debug
    archive:
      config: Release
