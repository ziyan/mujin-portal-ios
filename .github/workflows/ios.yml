name: iOS

# Nobody working on the app needs a Mac: the PortalKit tests run on Linux, and
# the app is built on GitHub's macOS runners, which are free for a public
# repository. TestFlight is a manual run (workflow_dispatch) of the TestFlight job,
# and every build it uploads goes on to the public group.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight
        type: boolean
        default: false

concurrency:
  # A manual dispatch (the TestFlight upload) has its own group, so a push never
  # replaces it while it waits for a runner.
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # First: nothing internal may reach this public repository.
  hygiene:
    name: Public content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check-public-content.sh
      - run: scripts/check-row-controls.sh

  # Whether a pull request touches the app. A required check that never
  # reports holds a pull request forever, so the workflow runs on every one
  # and the builds are skipped, which counts as passing, when nothing changed.
  changes:
    name: App changes
    needs: hygiene
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" != pull_request ] || git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -qE '^(PortalKit/|PortalApp/|PortalUITests/|PortalNotification/|Configuration/|Schema/|project\.yml|\.github/workflows/ios\.yml)'; then
            echo "app=true" >> "${GITHUB_OUTPUT}"
          else
            echo "app=false" >> "${GITHUB_OUTPUT}"
          fi

  kit:
    name: PortalKit on Linux
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test
        working-directory: PortalKit
        run: swift test

  app:
    name: App on macOS
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Say which Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Test PortalKit
        working-directory: PortalKit
        run: swift test

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      # A simulator build needs no signing, so it needs none of the
      # developer account's secrets either. The app is built for an iPhone and
      # for an iPad destination.
      - name: Build for an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+ Pro \(' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcodebuild build -project MujinPortal.xcodeproj -scheme MujinPortal -destination "id=${DEVICE}" -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build for an iPad simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPad Pro 13-inch' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcodebuild build -project MujinPortal.xcodeproj -scheme MujinPortal -destination "id=${DEVICE}" -derivedDataPath build-ipad CODE_SIGNING_ALLOWED=NO -quiet

      - name: Keep the simulator build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-app
          path: build/Build/Products/Debug-iphonesimulator/MujinPortal.app
          retention-days: 3

  # Drives the app in its demo mode on an iPhone simulator and taps through the
  # screens whose rows hold several controls: one tap must open one screen.
  ui-tests:
    name: UI tests on macOS
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run the UI tests
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+ Pro \(' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "${DEVICE}"
          xcrun simctl bootstatus "${DEVICE}" -b
          # When the app stops going idle, XCTest only says so. Keep a sample of
          # the process at that moment, which says where its main thread is.
          mkdir -p hang-samples
          touch ui-tests.log
          (
            SEEN=0
            while sleep 5; do
              COUNT=$(grep -c 'idle notification not received' ui-tests.log || true)
              if [ "${COUNT}" -gt "${SEEN}" ]; then
                SEEN=${COUNT}
                PID=$(pgrep -f 'MujinPortal.app/' | tail -1 || true)
                if [ -n "${PID}" ]; then
                  ps -o pid,%cpu,state,time,command -p "${PID}" > "hang-samples/process-${COUNT}.txt" 2>&1 || true
                  sudo sample "${PID}" 5 -file "${PWD}/hang-samples/sample-${COUNT}.txt" > "hang-samples/sample-${COUNT}.log" 2>&1 || true
                fi
              fi
            done
          ) &
          MONITOR=$!
          set +e
          xcodebuild test -project MujinPortal.xcodeproj -scheme MujinPortal -destination "id=${DEVICE}" -derivedDataPath build \
            -only-testing:MujinPortalUITests -parallel-testing-enabled NO -resultBundlePath ui-tests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-tests.log
          RESULT=${PIPESTATUS[0]}
          kill "${MONITOR}" || true
          exit "${RESULT}"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: ui-tests.xcresult
          retention-days: 3

      - name: Keep what was sampled
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hang-samples
          path: hang-samples
          if-no-files-found: ignore
          retention-days: 3

  # The screens of the demo server, as pictures to look at: an iPhone and a
  # 13-inch iPad, each in light, dark and the largest text size. Not required.
  screenshots:
    name: Screenshots (${{ matrix.family }})
    needs: app
    runs-on: macos-26
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iphone
            pattern: 'iPhone [0-9]+ Pro \('
          - family: ipad
            pattern: 'iPad Pro 13-inch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: simulator-app
          path: build/MujinPortal.app

      - name: Take the screenshots
        env:
          PATTERN: ${{ matrix.pattern }}
          FAMILY: ${{ matrix.family }}
        run: |
          mkdir -p screenshots
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "${PATTERN}" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "${DEVICE}"
          xcrun simctl bootstatus "${DEVICE}" -b
          xcrun simctl install "${DEVICE}" build/MujinPortal.app
          shoot() {
            SIMCTL_CHILD_PORTAL_DEMO_SCREEN="$2" SIMCTL_CHILD_PORTAL_DEMO_PERSONA="${3:-}" xcrun simctl launch "${DEVICE}" com.ziyan.mujinportal -demo
            sleep 6
            xcrun simctl io "${DEVICE}" screenshot "screenshots/${FAMILY}-$1.png"
            xcrun simctl terminate "${DEVICE}" com.ziyan.mujinportal
          }
