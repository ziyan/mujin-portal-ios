  # A screenshot cannot show a transition, so this records the simulator while
  # the demo pushes the Sites list into a search screen and pops back, in dark
  # and in light. Look at the frames: the search field keeps its fill throughout.
  transition:
    name: Transition recording
    needs: app
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: simulator-app
          path: build/MujinPortal.app

      - name: Record the push and pop
        run: |
          mkdir -p recordings
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+ Pro \(' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "${DEVICE}"
          xcrun simctl bootstatus "${DEVICE}" -b
          xcrun simctl install "${DEVICE}" build/MujinPortal.app
          for APPEARANCE in dark light; do
            xcrun simctl ui "${DEVICE}" appearance "${APPEARANCE}"
            sleep 3
            # The first recording after a boot or an appearance change can stop within seconds, so a clip
            # under a megabyte is recorded again.
            for ATTEMPT in 1 2 3; do
              xcrun simctl io "${DEVICE}" recordVideo --codec h264 --force "recordings/push-pop-${APPEARANCE}.mp4" &
              RECORDER=$!
              sleep 3
              SIMCTL_CHILD_PORTAL_DEMO_SCREEN=sites-push-pop SIMCTL_CHILD_PORTAL_DEMO_PERSONA=staff xcrun simctl launch "${DEVICE}" com.ziyan.mujinportal -demo
              sleep 22
              kill -INT "${RECORDER}" || true
              wait "${RECORDER}" || true
              xcrun simctl terminate "${DEVICE}" com.ziyan.mujinportal
              [ "$(stat -f%z "recordings/push-pop-${APPEARANCE}.mp4")" -gt 1000000 ] && break
            done
          done

      - name: Keep the recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transition-recordings
          path: recordings

  # Signs the app and uploads it to App Store Connect, where it appears in
  # TestFlight once Apple has processed it (usually 10 to 30 minutes). Run it
  # by hand: Actions, iOS, Run workflow, upload on. Signing is automatic: the
  # development certificate kept in the secrets signs the archive, and the App
  # Store Connect key, with the Admin role, lets Xcode fetch the profiles and
  # the distribution certificate it needs.
  testflight:
    name: TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    needs: [kit, app, ui-tests]
    runs-on: macos-26
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The project is generated, with what Homebrew installs, before the
      # App Store Connect key is on disk: nothing installed reads it.
      - name: Generate the project
        run: |
          printf 'DEVELOPMENT_TEAM = %s\n' "${TEAM}" > Configuration/Identity.xcconfig
          brew install xcodegen
          xcodegen generate

      - name: Put the App Store Connect key where Xcode reads it
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/keys"
          printf '%s' "${KEY}" > "${RUNNER_TEMP}/keys/AuthKey_${KEY_ID}.p8"

      # Archiving signs with a development certificate. One is kept in the
      # secrets and put in a keychain of the run's own; without it Xcode
      # would make a new certificate every run, and Apple allows only a few.
      - name: Put the signing certificate in a keychain
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          printf '%s' "${CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/keys/development.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${RUNNER_TEMP}/keys/development.p12" -k "${KEYCHAIN}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          rm "${RUNNER_TEMP}/keys/development.p12"

      # The build number is the workflow's run number, which only grows, as
      # App Store Connect requires of builds of one version.
      - name: Archive
        run: >
          xcodebuild archive
          -project MujinPortal.xcodeproj
          -scheme MujinPortal
          -destination 'generic/platform=iOS'
          -archivePath build/MujinPortal.xcarchive
          -allowProvisioningUpdates
          -authenticationKeyPath "${RUNNER_TEMP}/keys/AuthKey_${KEY_ID}.p8"
          -authenticationKeyID "${KEY_ID}"
          -authenticationKeyIssuerID "${ISSUER_ID}"
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          -quiet

      - name: Sign and upload to App Store Connect
        run: >
          xcodebuild -exportArchive
          -archivePath build/MujinPortal.xcarchive
          -exportOptionsPlist Configuration/ExportOptions.plist
          -exportPath build/export
          -allowProvisioningUpdates
          -authenticationKeyPath "${RUNNER_TEMP}/keys/AuthKey_${KEY_ID}.p8"
          -authenticationKeyID "${KEY_ID}"
          -authenticationKeyIssuerID "${ISSUER_ID}"

      - name: Forget the keys
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" 2>/dev/null || true
          rm -rf "${RUNNER_TEMP}/keys" Configuration/Identity.xcconfig

  # Every build that reaches TestFlight goes to the public group too. It waits on
  # Apple's processing, so it runs on a cheap runner and not on the Mac.
  public-testflight:
    name: Public TestFlight
    needs: testflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_ID: "6829099282"
      BETA_GROUP_NAME: Public
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Give the build to the public group and submit it for beta review
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          export KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${KEY}" > "${KEY_PATH}"
          trap 'rm -f "${KEY_PATH}"' EXIT
          python3 scripts/publish-testflight.py ${{ github.run_number }}

      # Apple may take longer than this waits; the update feed workflow catches up.
      - name: Tell the apps about the newest installable build
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${KEY}" > "${KEY_PATH}"
          trap 'rm -f "${KEY_PATH}"' EXIT
          python3 scripts/publish-testflight.py --update-feed "${RUNNER_TEMP}/testflight.json" ${{ github.run_number }}
          scripts/upload-update-feed.sh "${RUNNER_TEMP}/testflight.json"
