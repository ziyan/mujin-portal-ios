name: iOS

# Nobody working on the app needs a Mac: the PortalKit tests run on Linux, and
# the app is built on GitHub's macOS runners, which are free for a public
# repository. TestFlight is a manual run (workflow_dispatch) of the TestFlight job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Whether a pull request touches the app. A required check that never
  # reports holds a pull request forever, so the workflow runs on every one
  # and the builds are skipped, which counts as passing, when nothing changed.
  changes:
    name: App changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" != pull_request ] || git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -qE '^(PortalKit/|PortalApp/|PortalNotification/|Configuration/|Schema/|project\.yml|\.github/workflows/ios\.yml)'; then
            echo "app=true" >> "${GITHUB_OUTPUT}"
          else
            echo "app=false" >> "${GITHUB_OUTPUT}"
          fi

  kit:
    name: PortalKit on Linux
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test
        working-directory: PortalKit
        run: swift test

  app:
    name: App on macOS
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Say which Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Test PortalKit
        working-directory: PortalKit
        run: swift test

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      # A simulator build needs no signing, so it needs none of the
      # developer account's secrets either.
      - name: Build for the simulator
        run: >
          xcodebuild build
          -project MujinPortal.xcodeproj
          -scheme MujinPortal
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          -quiet

      - name: Keep the simulator build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-app
          path: build/Build/Products/Debug-iphonesimulator/MujinPortal.app
          retention-days: 3

  # The screens of the demo server, as pictures to look at. Not required.
  screenshots:
    name: Screenshots
    needs: app
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: simulator-app
          path: build/MujinPortal.app

      - name: Take the screenshots
        run: |
          mkdir -p screenshots
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]+ Pro \(' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "${DEVICE}"
          xcrun simctl bootstatus "${DEVICE}" -b
          xcrun simctl install "${DEVICE}" build/MujinPortal.app
          for SCREEN in list conversation:conversation02 conversation:conversation01; do
            NAME="${SCREEN//:/-}"
            SIMCTL_CHILD_PORTAL_DEMO_SCREEN="${SCREEN}" xcrun simctl launch "${DEVICE}" com.ziyan.mujinportal -demo
            sleep 6
            xcrun simctl io "${DEVICE}" screenshot "screenshots/${NAME}.png"
            xcrun simctl terminate "${DEVICE}" com.ziyan.mujinportal
          done
          xcrun simctl ui "${DEVICE}" appearance dark
          SIMCTL_CHILD_PORTAL_DEMO_SCREEN="conversation:conversation02" xcrun simctl launch "${DEVICE}" com.ziyan.mujinportal -demo
          sleep 6
          xcrun simctl io "${DEVICE}" screenshot "screenshots/conversation-dark.png"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots

  # Signs the app and uploads it to App Store Connect, where it appears in
  # TestFlight once Apple has processed it (usually 10 to 30 minutes). Run it
  # by hand: Actions, iOS, Run workflow, upload on. Signing is automatic: the
  # development certificate kept in the secrets signs the archive, and the App
  # Store Connect key, with the Admin role, lets Xcode fetch the profiles and
  # the distribution certificate it needs.
  testflight:
    name: TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    needs: [kit, app]
    runs-on: macos-26
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The project is generated, with what Homebrew installs, before the
      # App Store Connect key is on disk: nothing installed reads it.
      - name: Generate the project
        run: |
          printf 'DEVELOPMENT_TEAM = %s\n' "${TEAM}" > Configuration/Identity.xcconfig
          brew install xcodegen
          xcodegen generate

      - name: Put the App Store Connect key where Xcode reads it
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/keys"
          printf '%s' "${KEY}" > "${RUNNER_TEMP}/keys/AuthKey_${KEY_ID}.p8"

      # Archiving signs with a development certificate. One is kept in the
      # secrets and put in a keychain of the run's own; without it Xcode
      # would make a new certificate every run, and Apple allows only a few.
      - name: Put the signing certificate in a keychain
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          printf '%s' "${CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/keys/development.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${RUNNER_TEMP}/keys/development.p12" -k "${KEYCHAIN}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          rm "${RUNNER_TEMP}/keys/development.p12"

      # The build number is the workflow's run number, which only grows, as
      # App Store Connect requires of builds of one version.
      - name: Archive
        run: >
          xcodebuild archive
          -project MujinPortal.xcodeproj
          -scheme MujinPortal
          -destination 'generic/platform=iOS'
          -archivePath build/MujinPortal.xcarchive
          -allowProvisioningUpdates
          -authenticationKeyPath "${RUNNER_TEMP}/keys/AuthKey_${KEY_ID}.p8"
          -authenticationKeyID "${KEY_ID}"
          -authenticationKeyIssuerID "${ISSUER_ID}"
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          -quiet

      - name: Sign and upload to App Store Connect
        run: >
          xcodebuild -exportArchive
          -archivePath build/MujinPortal.xcarchive
          -exportOptionsPlist Configuration/ExportOptions.plist
          -exportPath build/export
          -allowProvisioningUpdates
          -authenticationKeyPath "${RUNNER_TEMP}/keys/AuthKey_${KEY_ID}.p8"
          -authenticationKeyID "${KEY_ID}"
          -authenticationKeyIssuerID "${ISSUER_ID}"

      - name: Forget the keys
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" 2>/dev/null || true
          rm -rf "${RUNNER_TEMP}/keys" Configuration/Identity.xcconfig
